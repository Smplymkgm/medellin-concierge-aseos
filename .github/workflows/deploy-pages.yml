name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stage site with auto cache buster
        run: |
          mkdir -p _site
          # GitHub Pages sirve index.html (minúscula) como página por defecto.
          # El archivo fuente es Index.html, así que lo publicamos en minúscula.
          cp Index.html _site/index.html
          cp -r app _site/
          SHORT_SHA="${GITHUB_SHA:0:7}"
          # Reemplaza cualquier ?v=... en script src de .jsx por el SHA del commit
          sed -i "s/\\.jsx?v=[^\"]*\"/\\.jsx?v=$SHORT_SHA\"/g" _site/index.html
          # Idem para el meta app-version que lee checkForUpdate() en app.jsx
          sed -i "s/name=\"app-version\" content=\"[^\"]*\"/name=\"app-version\" content=\"$SHORT_SHA\"/" _site/index.html
          # version.json: la app corriendo lo poll-ea (ver checkForUpdate en
          # app.jsx) para detectar que hay un deploy nuevo y recargar sola.
          # Sin esto, una pestaña dejada abierta (el caso normal de las
          # aseadoras en el celular) nunca vuelve a pedir index.html y se
          # queda con el JS viejo en memoria para siempre, sin importar el
          # cache-control de GitHub Pages.
          echo "{\"version\":\"$SHORT_SHA\"}" > _site/version.json
          # Compatibilidad: publicar también Index.html (mayúscula) para accesos
          # directos guardados con la URL vieja.
          cp _site/index.html _site/Index.html
          # Imprime el resultado para debug
          grep -o "\\.jsx?v=[^\"]*\"" _site/index.html | sort -u
          cat _site/version.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
